<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Merging Galaxies</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="galaxiesCanvas"></canvas>
  <script>
  (function() {
    const canvas = document.getElementById('galaxiesCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;

    // We no longer track temporary repulsion. Galaxies always attract each other
    // gravitationally. This constant attraction ensures they merge and whirl
    // together naturally before separating again under conservation of momentum.
    const repulsePairs = {};

    // Star class representing a particle in a galaxy
    class Star {
      constructor(baseR, angle, speed, size, brightness, hue, phase, amplitude) {
        this.baseR = baseR;
        this.angle = angle;
        this.speed = speed;
        this.size = size;
        this.brightness = brightness;
        this.hue = hue;
        this.phase = phase;
        this.amplitude = amplitude;
        this.dx = 0;
        this.dy = 0;
        this.vx = 0;
        this.vy = 0;
        this.currentR = baseR;
      }
    }

    // Galaxy class representing a swirling cluster of stars moving across the screen
    class Galaxy {
      constructor(hue) {
        this.hue = hue;
        this.init();
      }
      init() {
        const minDimension = Math.min(width, height);
        // radius between 15% and 20% of the smallest dimension
        this.radius = minDimension * (0.15 + Math.random() * 0.05);
        // initial position anywhere on screen, but avoid edges to ensure full visibility
        this.x = Math.random() * (width - 2 * this.radius) + this.radius;
        this.y = Math.random() * (height - 2 * this.radius) + this.radius;
        // velocity for galaxy movement; reduce the initial speed so gravitational
        // attraction has a more pronounced effect on their trajectories. A lower
        // starting speed allows galaxies to curve toward each other rather than
        // sailing straight across the screen.
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        // rotation direction
        this.dir = Math.random() < 0.5 ? -1 : 1;
        // create stars
        this.stars = [];
        this.createStars();
        // Assign a mass to the galaxy. More stars and a larger radius imply a larger
        // mass. This mass will influence how strongly galaxies accelerate under
        // gravity and repulsion. A simple heuristic ties mass to the product of
        // radius and star count.
        this.mass = this.radius * this.stars.length / 150;
      }
      createStars() {
        // Number of stars scaled to radius
        // Increase the number of stars for a richer galaxy appearance
        const count = Math.floor(200 + this.radius * 0.3);
        this.stars.length = 0;
        for (let i = 0; i < count; i++) {
          const r = Math.random() * this.radius;
          const angle = Math.random() * Math.PI * 2;
          // Slow down orbital speed for gentler swirling
          const speed = 0.0003 + Math.random() * 0.001;
          const size = 1 + Math.random() * 1.5;
          const brightness = 40 + Math.random() * 40;
          const hueVariation = this.hue + (Math.random() - 0.5) * 30;
          const phase = Math.random() * Math.PI * 2;
          const amplitude = r * 0.05;
          this.stars.push(new Star(r, angle, speed, size, brightness, hueVariation, phase, amplitude));
        }
      }
      updatePosition() {
        // Update galaxy center based on velocity and wrap around the canvas edges.
        // Instead of repositioning the galaxy to an offset outside the viewport and
        // shifting all the star offsets, we simply wrap the core position using
        // modular arithmetic. This ensures the galaxy (and its stars) appear
        // seamlessly when crossing boundaries without generating large jumps in
        // star offsets.
        this.x += this.vx;
        this.y += this.vy;
        // Wrap horizontally
        if (this.x < 0) {
          this.x += width;
        } else if (this.x >= width) {
          this.x -= width;
        }
        // Wrap vertically
        if (this.y < 0) {
          this.y += height;
        } else if (this.y >= height) {
          this.y -= height;
        }
      }
      updateStars(dtNorm) {
        // Update orbital positions and radial breathing for stars. Use the
        // normalized delta time (dtNorm) scaled by the nominal frame time (~16.67 ms)
        // so that rotations occur at a consistent rate regardless of frame duration.
        const frameMs = 16.6667;
        for (const star of this.stars) {
          star.angle += star.speed * this.dir * dtNorm * frameMs;
          star.currentR = star.baseR + star.amplitude * Math.sin(performance.now() * 0.0003 + star.phase);
        }
      }
      applyInteractionForces(otherGalaxy, repulsionDist2, repulsionStrength, attractionStrength) {
        // If galaxies are far apart, skip interactions
        const dxg = otherGalaxy.x - this.x;
        const dyg = otherGalaxy.y - this.y;
        const distg2 = dxg * dxg + dyg * dyg;
        const maxDist = (this.radius + otherGalaxy.radius) * 1.4;
        if (distg2 > maxDist * maxDist) return;
        // Precompute star positions for the other galaxy
        const otherPositions = [];
        for (const s of otherGalaxy.stars) {
          const px = otherGalaxy.x + s.currentR * Math.cos(s.angle) + s.dx;
          const py = otherGalaxy.y + s.currentR * Math.sin(s.angle) + s.dy;
          otherPositions.push({x: px, y: py, star: s});
        }
        // For each star in this galaxy, compute interactions with stars in the other galaxy.
        // If the distance between two stars is smaller than repulsionDist2, apply a
        // repulsive force to prevent clumping. Otherwise apply a weaker attractive
        // force to create long tidal tails and streams. Distances beyond maxDist
        // have already been skipped.
        for (const star of this.stars) {
          const px = this.x + star.currentR * Math.cos(star.angle) + star.dx;
          const py = this.y + star.currentR * Math.sin(star.angle) + star.dy;
          for (const op of otherPositions) {
            let dx = op.x - px;
            let dy = op.y - py;
            if (dx > width / 2) dx -= width;
            if (dx < -width / 2) dx += width;
            if (dy > height / 2) dy -= height;
            if (dy < -height / 2) dy += height;
            const dist2 = dx * dx + dy * dy;
            if (dist2 === 0) continue;
            let sign;
            let force;
            if (dist2 < repulsionDist2) {
              // Repulsion at very close range
              sign = -1;
              force = repulsionStrength / dist2;
            } else {
              // Attraction beyond the repulsion radius
              sign = 1;
              force = attractionStrength / dist2;
            }
            star.vx += sign * force * dx;
            star.vy += sign * force * dy;
            op.star.vx -= sign * force * dx;
            op.star.vy -= sign * force * dy;
          }
        }
      }
      integrateStarOffsets() {
        // After forces have been applied, update offset positions and damp velocities to ensure return to orbit
        // Stronger damping: reduce extra velocity and pull offsets back toward the galaxy core more quickly
        // Damping factors for star velocities and offsets. Increase friction
        // (closer to 1) so stars retain more of the momentum imparted by
        // interactions, allowing them to whirl out further. Increase the
        // restoration factor slightly so stars return to their galaxy cores
        // more slowly after being disturbed.
        const friction = 0.96;
        const restore = 0.98;
        for (const star of this.stars) {
          star.dx += star.vx;
          star.dy += star.vy;
          star.vx *= friction;
          star.vy *= friction;
          // Decay offsets towards base orbit to reattach to galaxy core
          star.dx *= restore;
          star.dy *= restore;
          // Keep offsets within half the canvas dimensions. By wrapping the offsets
          // into the range [-width/2, width/2] and [-height/2, height/2], the
          // position calculations remain numerically stable and distances stay
          // correctly bounded for periodic boundary computations.
          if (star.dx < -width / 2) {
            star.dx += width;
          } else if (star.dx > width / 2) {
            star.dx -= width;
          }
          if (star.dy < -height / 2) {
            star.dy += height;
          } else if (star.dy > height / 2) {
            star.dy -= height;
          }
        }
      }
      draw() {
        // Draw each star
        for (const star of this.stars) {
          // compute final position including offset from interactions
          let sx = this.x + star.currentR * Math.cos(star.angle) + star.dx;
          let sy = this.y + star.currentR * Math.sin(star.angle) + star.dy;
          // Wrap the rendered position around the canvas without modifying the
          // underlying offsets. This ensures stars seamlessly reappear on the
          // opposite edges when crossing boundaries while leaving their local
          // offsets intact for physics calculations.
          if (sx < 0) {
            sx += width;
          } else if (sx >= width) {
            sx -= width;
          }
          if (sy < 0) {
            sy += height;
          } else if (sy >= height) {
            sy -= height;
          }
          // brightness pulsing
          const lightness = star.brightness + Math.sin(performance.now() * 0.0006 + star.phase) * 10;
          const color = `hsla(${star.hue}, 80%, ${lightness}%, 0.9)`;
          const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, star.size);
          grad.addColorStop(0, color);
          grad.addColorStop(1, `hsla(${star.hue}, 80%, ${lightness}%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    let galaxies = [];
    let wanderers = [];

    // Create white wandering stars that roam the canvas and are slightly influenced by galaxies
    function createWanderers() {
      wanderers = [];
      // Number of wandering stars based on canvas size
      const count = Math.floor((width + height) * 0.05);
      for (let i = 0; i < count; i++) {
        const w = {
          x: Math.random() * width,
          y: Math.random() * height,
          // initial velocities: give wanderers a gentle initial impulse
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          size: Math.random() * 1.5 + 0.5,
          // Reduce brightness (alpha) so wandering stars are more subtle on screen
          alpha: Math.random() * 0.25 + 0.15
        };
        wanderers.push(w);
      }
    }

    // Update roaming white stars: apply weak gravitational attraction to galaxies, move and wrap, then draw
    function updateWanderers(dtNorm) {
      // gravitational constant for wanderers: increase attraction so they are more influenced by galaxy gravity
      const Gw = 0.002;
      // friction factor: remove friction so wanderers retain their momentum
      const friction = 1.0;
      for (const w of wanderers) {
        // Apply gravitational acceleration from each galaxy core
        for (const g of galaxies) {
          let dx = g.x - w.x;
          let dy = g.y - w.y;
          // Use shortest distance considering wrap
          if (dx > width / 2) dx -= width;
          if (dx < -width / 2) dx += width;
          if (dy > height / 2) dy -= height;
          if (dy < -height / 2) dy += height;
          const dist2 = dx * dx + dy * dy + 1e-6;
          const acc = (Gw * dtNorm) / dist2;
          w.vx += acc * dx;
          w.vy += acc * dy;
        }
        // Apply friction to velocities
        w.vx *= friction;
        w.vy *= friction;
        // Add a small random drift to wanderers so their paths are less predictable
        w.vx += (Math.random() - 0.5) * 0.0002;
        w.vy += (Math.random() - 0.5) * 0.0002;
        // Update positions (scaled by dtNorm to approximate real time)
        w.x += w.vx;
        w.y += w.vy;
        // Wrap around boundaries
        if (w.x < 0) w.x += width;
        if (w.x > width) w.x -= width;
        if (w.y < 0) w.y += height;
        if (w.y > height) w.y -= height;
        // Draw wanderer as small glowing dot
        const grad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.size);
        grad.addColorStop(0, `rgba(255,255,255,${w.alpha})`);
        grad.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function setup() {
      width = 3840;
      height = 2160;
      const dpr = 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Initialize galaxies with distinct hues
      galaxies = [];
      // Seven distinct hues for more galaxies and collisions
      const hues = [200, 260, 320, 150, 40, 100, 300];
      for (const hue of hues) {
        galaxies.push(new Galaxy(hue));
      }

      // Create roaming white stars
      createWanderers();
    }

    let lastTime = 0;
    function animate(timestamp) {
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      // Normalized delta time relative to 60 FPS. Clamp dtNorm to avoid
      // extremely large values when the tab regains focus after being inactive.
      let dtNorm = delta / 16.6667;
      // Clamp dtNorm to 1 so that a long pause (e.g., tab inactive) does not
      // scale up velocities or forces. This ensures the simulation remains
      // consistent even when the rendering is throttled in the background.
      if (dtNorm > 1) dtNorm = 1;
      // Apply continuous gravitational attraction between galaxy cores. To ensure
      // that attraction has a noticeable effect on trajectories, we use a larger
      // gravitational constant and ignore mass weighting. Each pair of galaxies
      // experiences an acceleration proportional to the separation vector divided
      // by the square of the distance. dtNorm scales the force per frame.
      const G = 0.5;
      for (let i = 0; i < galaxies.length; i++) {
        for (let j = i + 1; j < galaxies.length; j++) {
          const g1 = galaxies[i];
          const g2 = galaxies[j];
          let dx = g2.x - g1.x;
          let dy = g2.y - g1.y;
          if (dx > width / 2) dx -= width;
          if (dx < -width / 2) dx += width;
          if (dy > height / 2) dy -= height;
          if (dy < -height / 2) dy += height;
          const dist2 = dx * dx + dy * dy + 1e-6;
          const force = (G * dtNorm) / dist2;
          const ax = force * dx;
          const ay = force * dy;
          g1.vx += ax;
          g1.vy += ay;
          g2.vx -= ax;
          g2.vy -= ay;
        }
      }
      // Update galaxy positions and internal star states. Before moving each
      // galaxy, add a tiny random impulse to keep the simulation from getting
      // stuck in a static orbit pattern. This jitter is small enough not to
      // disrupt the overall flow but ensures continual variation.
      for (const g of galaxies) {
        g.vx += (Math.random() - 0.5) * 0.002;
        g.vy += (Math.random() - 0.5) * 0.002;
        g.updatePosition();
        g.updateStars(dtNorm);
      }
      // Apply star–star interactions between galaxies. Stars closer than the
      // repulsion radius will repel each other to prevent clumping, while
      // those farther apart will attract each other weakly to form tidal
      // features during mergers. Beyond a certain separation, interactions
      // are ignored in applyInteractionForces itself.
      const repulsionRadius = 120;
      const repulsionDist2 = repulsionRadius * repulsionRadius;
      const repulsionStrength = 0.15;
      const attractionStrength = 0.02;
      for (let i = 0; i < galaxies.length; i++) {
        for (let j = i + 1; j < galaxies.length; j++) {
          galaxies[i].applyInteractionForces(galaxies[j], repulsionDist2, repulsionStrength, attractionStrength);
        }
      }
      // Integrate offsets and damp velocities
      for (const g of galaxies) {
        g.integrateStarOffsets();
      }
      // Draw galaxies
      for (const g of galaxies) {
        g.draw();
      }
      // Update and draw roaming white stars
      updateWanderers(dtNorm);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', setup);
    setup();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
